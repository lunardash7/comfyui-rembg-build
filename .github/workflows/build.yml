name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RunPod Official Source
        uses: actions/checkout@v4
        with:
          repository: runpod-workers/worker-comfyui

      - name: Inject rembg into Dockerfile
        run: |
          echo "" >> Dockerfile
          echo "# --- Custom rembg Installation ---" >> Dockerfile
          echo "RUN pip install --no-cache-dir rembg onnxruntime-gpu" >> Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-rembg:v1

name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 런팟의 ComfyUI 공식 소스 코드를 통째로 가져옵니다. (권한 에러 원천 차단)
      - name: Checkout RunPod Official Source
        uses: actions/checkout@v4
        with:
          repository: runpod-workers/worker-comfyui

      # 2. 가져온 공식 도커 파일의 맨 마지막에 rembg 설치 코드를 자동으로 끼워 넣습니다.
      - name: Inject rembg into Dockerfile
        run: |
          echo "" >> Dockerfile
          echo "# --- Custom rembg Installation ---" >> Dockerfile
          echo "USER root" >> Dockerfile
          echo "RUN apt-get update && apt-get install -y libgl1-mesa-glx && rm -rf /var/lib/apt/lists/*" >> Dockerfile
          echo "RUN pip install --no-cache-dir rembg onnxruntime-gpu" >> Dockerfile

      # 3. 고객님의 도커 허브로 로그인합니다.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 수정된 레시피대로 뼈대부터 빌드하여 도커 허브로 쏴줍니다.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-rembg:v1
